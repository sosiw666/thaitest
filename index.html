<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สวัสดี ม.2/3</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --ease:cubic-bezier(.4,0,.2,1); }
  *{ box-sizing:border-box; margin:0; }
  html,body{ height:100%; }
  body{
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    font-family:'Noto Sans Thai',system-ui,sans-serif;
    background:#1b1f3a; color:#fff; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }

  /* พื้นหลังสีสันให้เห็น liquid glass ชัด */
  .bg{ position:fixed; inset:0; z-index:0; overflow:hidden;
    background:linear-gradient(135deg,#2b3060,#47316f 50%,#1f5a72); }
  .blob{ position:absolute; border-radius:50%; will-change:transform;
    animation:drift 30s ease-in-out infinite alternate; }
  .b1{ width:70vmax; height:70vmax; top:-25vmax; left:-20vmax;
    background:radial-gradient(circle,rgba(197,111,160,.55),rgba(197,111,160,0) 65%); }
  .b2{ width:65vmax; height:65vmax; bottom:-25vmax; right:-20vmax; animation-delay:-8s;
    background:radial-gradient(circle,rgba(90,169,201,.55),rgba(90,169,201,0) 65%); }
  .b3{ width:45vmax; height:45vmax; top:30%; left:40%; animation-delay:-14s;
    background:radial-gradient(circle,rgba(201,176,112,.35),rgba(201,176,112,0) 65%); }
  @keyframes drift{ to{ transform:translate3d(6vmax,-4vmax,0) scale(1.08); } }

  main{ position:relative; z-index:1; width:100%; max-width:560px;
    display:flex; flex-direction:column; align-items:center; gap:28px; }

  /* ข้อความสีขาว ขอบดำ */
  .text{
    font-size:clamp(26px,6vw,42px); font-weight:700; line-height:1.5;
    color:#fff; -webkit-text-stroke:2px #000; paint-order:stroke fill;
    text-shadow:0 0 2px #000, 0 0 2px #000;
    opacity:0; transition:opacity .6s var(--ease);
  }
  .text.show{ opacity:1; }
  .text.small{ font-size:clamp(20px,4.5vw,28px); }
